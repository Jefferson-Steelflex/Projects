<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Page</title>
    <link rel="stylesheet" href="Practice.css" />
  </head>

  <!-- Grid Section -->
  <body>
    <section class="Dino-Grid">
      <div
        class="Dino-Card"
        data-name="Tyrannosaurus Rex"
        data-period="Late Cretaceous"
      >
        <h2>Tyrannosaurus Rex</h2>

        <img
          class="Dino-Image"
          src="images/Tyrannosaurus Rex.png"
          alt="Tyrannosaurus Rex"
        />

        <!-- Data Entry -->
        <div
          class="Dino-Data"
          data-era="Late Cretaceous"
          data-family="Tyrannosauridae"
          data-genus="Tyrannosaurus"
          data-height="5.2M"
          data-weight="8.4T"
          data-length="13.5M"
          data-diet="Carnivore, Live Prey"
          data-image="images/Tyrannosaurus Rex.png"
          data-description='The most famous of all dinosaurs, Tyrannosaurus rex enjoys a fearsome reputation around the world thanks to its size, power and aggression 
         - a status borne out by its name, which translates to "King of the tyrant lizards". At around 13.5m in length and over eight tons in weight, 
         Tyrannosaurus rex was the apex predator of its time, with the most powerful jaw known to science and rows of large, serrated teeth.'
          data-discovery="American geologist Arthur Lakes lays claim to the discovery of Tyrannosaurus rex, when he unearthed multiple teeth in the Morrison Formation, Colorado.
           The teeth were initially believed to belong to Ornithomimus, but the subsequent discovery of a partial skeleton by Barnum Brown while investigating 
           a site in Wyoming in 1900 was classified as Tyrannosaurus rex five years later, with Lakes' find later attributed to the same genus."
          data-paleoecology="Tyrannosaurus rex roamed the western side of North America during the Late Cretaceous period, approximately 66-68m years ago. As the 
          apex predator of this period, it fed on a wide array of prey including hadrosaurs, ankylosaurs and even large sauropods, 
          using its excellent hearing and heightened sense of smell to hunt down targets."
        ></div>
      </div>

      <!-- Start of Nanotyrannus Card-->
      <div
        class="Dino-Card"
        data-name="Nanotyrannus"
        data-period="Late Cretaceous"
      >
        <h2>Nanotyrannus</h2>

        <img
          class="Dino-Image"
          src="images/Nanotyrannus.png"
          alt="Nanotyrannus"
        />

        <!-- Data Entry -->
        <div
          class="Dino-Data"
          data-era="Late Cretaceous"
          data-family="Nanotyrannidae"
          data-genus="Nanotyrannus"
          data-height="2.1M"
          data-weight="700KG"
          data-length="5.5M"
          data-diet="Carnivore, Live Prey"
          data-image="images/Nanotyrannus.png"
          data-description="Often regarded as one of the most controversial dinosaurs, Nantyrannus has long been associated with a more lightly built, 
         agile tyrannosaur from Late Cretaceous North America. Thought by some to represent a distinct genus and by others a juvenile 
         Tyrannosaurus rex, Nantyrannus is characterized by its slender proportions, longer legs, and relatively narrow skull. 
         At an estimated 5–6 meters in length, it would have been a fast and active predator, relying on speed and sharp, 
         blade-like teeth to hunt smaller prey rather than overwhelming force. Whether a separate species or a youthful stage of the tyrant king itself, 
         Nantyrannus offers valuable insight into the growth, behavior, and diversity of tyrannosaur predators."
          data-discovery="American paleontologist Charles Sternberg is credited with the discovery of Nantyrannus, when he unearthed a partial skeleton 
         in the Lance Formation of Montana in the 1940s. The specimen was long thought to represent a juvenile Tyrannosaurus rex, 
         but later studies suggested it might belong to a distinct genus. Debate continues to this day, with some researchers treating 
         Nantyrannus as a separate species, while others argue it is merely a young T. rex, making the fossil a key piece in understanding tyrannosaur growth and diversity."
          data-paleoecology="Nantyrannus lived in western North America during the Late Cretaceous, around 66–68 million years ago. As a smaller, more agile 
        tyrannosaur, it likely hunted smaller dinosaurs and other prey, using speed, keen eyesight, and sharp teeth to catch its targets. 
        Its lightweight build and long legs suggest it relied on agility rather than sheer strength, occupying a 
        different ecological niche than its massive relative, Tyrannosaurus rex."
        ></div>
      </div>

      <div
        class="Dino-Card"
        data-name="Becklespinax"
        data-period="Early Cretaceous"
      >
        <h2>Becklespinax</h2>

        <img
          class="Dino-Image"
          src="images/Becklespinax.png"
          alt="Becklespinax"
        />

        <!-- Data Entry -->
        <div
          class="Dino-Data"
          data-era="Early Cretaceous"
          data-family="Undetermined"
          data-genus="Altispinax"
          data-height="Unknown"
          data-weight="Unknown"
          data-length="Unknown"
          data-diet="Carnivore, Live Prey"
          data-image="images/Becklespinax.png"
          data-description="Becklespinax or Formally known as Altispinax was a predatory theropod from the Early Cretaceous of England, estimated at around 6–7 m in 
        length and roughly 700–900 kg, though these figures remain uncertain due to its fragmentary fossil remains. 
        Its elongated skull and blade-like teeth suggest it was an agile hunter of smaller dinosaurs. While its exact classification 
        is debated, Becklespinax stands out as one of the most intriguing European theropods of its time."
          data-discovery="British paleontologist Reginald Hooley first described Becklespinax in the 1920s from partial vertebrae found on 
         the Isle of Wight. The fossils were originally assigned to other theropods, but later study highlighted distinctive features, 
         such as tall neural spines along the back. Debate persists over whether Becklespinax represents a separate genus or is closely 
         related to other European theropods, reflecting the challenges of interpreting fragmentary remains."
          data-paleoecology="Becklespinax lived in coastal floodplains of southern England during the Early Cretaceous, roughly 130–125 million years ago. 
         As a moderately sized predator, it likely hunted smaller herbivorous dinosaurs, relying on speed and agility rather than brute strength. 
         Its lightweight build and tall back spines suggest adaptations for active hunting, but much of its lifestyle and exact size 
         remain speculative due to the incomplete fossil record."
        ></div>
      </div>
    </section>
    <!-- End of Grid Section -->

    <!-- Start of Info Section -->
    <section class="Dino-Info hidden">
      <div class="Info-Panel-Layout">
        <div class="Info-Left">
          <!--Button to return back to the grid -->
          <button id="Back-Button">Back</button>

          <h2 class="Dino-Name"></h2>
          <h2 class="Dino-Stats">Stats</h2>

          <p class="Dino-Info"><span>Era</span><span class="era"></span></p>
          <p class="Dino-Info">
            <span>Family</span><span class="family"></span>
          </p>
          <p class="Dino-Info"><span>Genus</span><span class="genus"></span></p>
          <p class="Dino-Info">
            <span>Height</span><span class="height"></span>
          </p>
          <p class="Dino-Info">
            <span>Weight</span><span class="weight"></span>
          </p>
          <p class="Dino-Info">
            <span>Length</span><span class="length"></span>
          </p>
          <p class="Dino-Info"><span>Diet</span><span class="diet"></span></p>

          <div class="Description">
            <h2>Description</h2>
            <p class="description"></p>
          </div>

          <div class="Discovery">
            <h2>Discovery</h2>
            <p class="discovery"></p>
          </div>

          <div class="Paleoecology">
            <h2>Paleoecology</h2>
            <p class="paleoecology">
              <br />
              <br />
              <br />
              <br />
            </p>
          </div>
        </div>

        <div class="Info-Right">
          <img class="Dino-Image-Large" src="" alt="Dinosaur Image" />
        </div>
      </div>
    </section>
    <!-- End of Info Section -->
    <script src="Practice.js"></script>
  </body>
</html>
